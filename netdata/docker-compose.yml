name: netdata

services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: debianchito
    restart: unless-stopped
    network_mode: host
    pid: host

    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined

    environment:
      - NETDATA_LISTENER_PORT=19999
      - NETDATA_BIND_TO=127.0.0.1
      - TZ=Europe/Madrid

    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:

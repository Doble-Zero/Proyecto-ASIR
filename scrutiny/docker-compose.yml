name: scrutiny

services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:latest
    container_name: scrutiny
    restart: unless-stopped
    privileged: true

    environment:
      - TZ=Europe/Madrid

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - /run/udev:/run/udev:ro        # Discos del sistema
      - ./scrutiny-config:/config     # Configuración y métricas

    networks:
      - scrutiny_net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  scrutiny_net:
    driver: bridge

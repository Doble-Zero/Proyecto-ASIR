name: portainer

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    environment:
      - TZ=Europe/Madrid

    ports:
      - "192.168.1.35:9443:9443" # Interfaz web (Red Lan)

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    networks:
      - portainer_net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  portainer_data:
    external: true

networks:
  portainer_net:
    driver: bridge
